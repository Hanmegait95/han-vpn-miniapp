<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кабинет Han VPN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  /* ───────────────────────────────────────────────
     Han VPN — токены из промо-исходников
     GREEN #22c55e · CREAM #F7F3EA · RED #FF2A2A · BG #0A0A0A
     Archivo 900 (дисплей) + JetBrains Mono (служебный слой)
     Тема одна и намеренная: чёрный терминал. Все цвета заданы явно.
     ─────────────────────────────────────────────── */
  :root {
    --ink:      #0A0A0A;
    --ink-2:    #0F1310;   /* поверхность, нейтраль со сдвигом в зелёный */
    --ink-3:    #141A16;
    --line:     #1E261F;
    --line-hi:  #2C3A2F;
    --cream:    #F7F3EA;
    --mute:     #7F8C83;
    --mute-2:   #5A655D;
    --green:    #22C55E;
    --green-dim:#137A38;
    --red:      #FF2A2A;
    --shell:    420px;

    --t-1: 11px; --t-2: 13px; --t-3: 15px; --t-4: 18px;
    --d-1: 30px; --d-2: 40px; --d-3: 52px;

    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'Archivo', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    --ease: cubic-bezier(.2, .7, .3, 1);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--cream);
    font-family: var(--sans);
    font-size: var(--t-3);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Атмосфера: скан-линии + зелёное свечение сверху — как в баннерах */
  .grain, .glow { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
  .grain { background: repeating-linear-gradient(0deg, rgba(247,243,234,.024) 0 1px, transparent 1px 3px); mix-blend-mode: screen; }
  .glow  { z-index: 0; background: radial-gradient(120% 62% at 50% -12%, rgba(34,197,94,.15), transparent 62%); }

  .shell {
    position: relative; z-index: 1;
    max-width: var(--shell); margin: 0 auto;
    min-height: 100dvh;
    display: flex; flex-direction: column;
    padding-bottom: 110px;  /* место под кнопку главного действия */
  }

  /* ── Шапка ─────────────────────────────────────── */
  .top {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 10px;
    padding: 14px 20px 12px;
    background: linear-gradient(var(--ink) 72%, rgba(10,10,10,0));
    border-bottom: 1px solid var(--line);
  }
  .mark { width: 30px; height: 30px; flex: none; display: block; border-radius: 9px; }
  .wordmark { font-weight: 800; font-size: var(--t-4); letter-spacing: -.015em; }
  .wordmark span { color: var(--green); }

  .eyebrow {
    margin-left: auto;
    display: flex; align-items: center; gap: 7px;
    font-family: var(--mono); font-size: var(--t-1); font-weight: 500;
    letter-spacing: .16em; text-transform: uppercase; color: var(--mute);
  }
  .beacon { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); }
  [data-state="off"] .beacon { background: var(--red); box-shadow: 0 0 10px var(--red); animation: pulse 1.6s var(--ease) infinite; }
  [data-state="off"] .eyebrow { color: var(--red); }
  @keyframes pulse { 50% { opacity: .25; } }

  /* ── Общий строй секций ────────────────────────── */
  .sec { padding: 26px 20px; border-bottom: 1px solid var(--line); }
  .sec:last-of-type { border-bottom: 0; }  /* под последней секцией линии не нужно */
  .cmd {
    font-family: var(--mono); font-size: var(--t-2); color: var(--mute);
    display: flex; gap: 9px; align-items: baseline;
  }
  .cmd b { color: var(--green); font-weight: 500; }

  .display {
    font-weight: 900; font-size: var(--d-3); line-height: .88;
    letter-spacing: -.045em; text-transform: uppercase;
    text-wrap: balance; margin: 16px 0 0;
  }
  .display .hi { color: var(--green); display: block; }
  [data-state="off"] .display .hi { color: var(--red); }

  .note {
    font-family: var(--mono); font-size: var(--t-2); color: var(--mute);
    margin-top: 14px; display: flex; align-items: center; gap: 8px;
  }
  .note .arrow { color: var(--green); }
  .caret { display: inline-block; width: 8px; height: 15px; background: var(--green); animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .2; } }

  /* Шкала — прямая цитата из баннеров */
  .rail { margin-top: 22px; display: flex; align-items: center; gap: 12px; }
  .rail .track { flex: 1; height: 4px; background: var(--ink-3); overflow: hidden; }
  .rail .fill {
    height: 100%; background: var(--green); box-shadow: 0 0 16px rgba(34,197,94,.75);
    width: var(--pct, 100%); transition: width .5s var(--ease);
  }
  [data-state="off"] .rail .fill { background: var(--red); box-shadow: 0 0 16px rgba(255,42,42,.6); }
  .rail .val {
    font-family: var(--mono); font-size: var(--t-2); color: var(--mute);
    font-variant-numeric: tabular-nums; letter-spacing: .04em;
  }
  [data-state="off"] .rail .val { color: var(--red); }

  /* ── Кнопки ────────────────────────────────────── */
  .btn {
    appearance: none; border: 1px solid transparent; cursor: pointer;
    font-family: var(--sans); font-weight: 700; font-size: var(--t-3);
    letter-spacing: -.005em;
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    padding: 14px 18px; width: 100%; text-decoration: none;
    transition: transform .12s var(--ease), background .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease);
  }
  .btn:active { transform: scale(.985); }
  .btn:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }

  .btn-solid { background: var(--green); color: #04140A; }
  .btn-solid:hover { background: #2ade6c; }
  .btn-alarm { background: var(--red); color: #fff; }
  .btn-alarm:hover { background: #ff4444; }
  .btn-ghost { background: var(--ink-2); border-color: var(--line-hi); color: var(--cream); }
  .btn-ghost:hover { border-color: var(--green-dim); background: var(--ink-3); }
  /* Текстовая ссылка-переключатель */
  .linkish {
    appearance: none; background: none; border: 0; cursor: pointer; padding: 0;
    font-family: var(--mono); font-size: var(--t-2); color: var(--mute);
    border-bottom: 1px dashed var(--line-hi); line-height: 1.35;
  }
  .linkish:hover { color: var(--green); border-bottom-color: var(--green-dim); }
  .linkish:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }

  /* ── Мастер: на экране всегда ровно одно действие ─
     Без подписки ставить приложение незачем: мастер сворачивается
     в тихую строку, чтобы не спорить с кнопкой продления. */
  #showConnect { display: none; }
  [data-state="off"]:not([data-connect-open]) #prog,
  [data-state="off"]:not([data-connect-open]) #wiz { display: none; }
  [data-state="off"]:not([data-connect-open]) #showConnect { display: block; }
  /* Подписки ещё нет: подключать нечего, сначала бесплатные дни */
  [data-state="none"] #prog, [data-state="none"] #wiz, [data-state="none"] #showConnect { display: none; }
  [data-state="none"] .beacon { background: var(--mute); box-shadow: none; }
  /* шторка тарифов */
  .plans { display: flex; flex-direction: column; gap: 8px; }
  .plans button {
    appearance: none; cursor: pointer; text-align: left;
    background: var(--ink); border: 1px solid var(--line); color: var(--cream);
    padding: 14px 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    font-family: var(--sans); font-size: var(--t-3); font-weight: 700;
  }
  .plans button small { font-family: var(--mono); font-size: var(--t-1); color: var(--mute); letter-spacing: .08em; text-transform: uppercase; }
  .plans button b { font-family: var(--mono); font-weight: 500; color: var(--green); }
  .plans button:hover { border-color: var(--green-dim); }
  .plans button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  .choice { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }

  .prog { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
  .prog-bar { display: flex; gap: 4px; flex: 1; }
  .prog-bar i { flex: 1; height: 4px; background: var(--ink-3); transition: background .3s var(--ease); }
  .prog-bar i[data-on] { background: var(--green); box-shadow: 0 0 12px rgba(34,197,94,.55); }
  .prog-txt {
    font-family: var(--mono); font-size: var(--t-1); letter-spacing: .16em;
    text-transform: uppercase; color: var(--mute); white-space: nowrap;
  }

  .wiz-step { margin-top: 22px; animation: rise .3s var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }

  .wiz-title { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.025em; line-height: 1.15; text-wrap: balance; }
  .wiz-title.ok { color: var(--green); text-transform: uppercase; font-weight: 900; font-size: var(--d-1); letter-spacing: -.035em; }
  .wiz-text { margin: 9px 0 0; font-size: var(--t-3); color: var(--mute); line-height: 1.5; max-width: 34ch; }
  .wiz-text b { color: var(--cream); font-weight: 600; }
  .wiz-step > .btn { margin-top: 20px; }

  /* запасные пути — тихие, всегда под главной кнопкой */
  .wiz-alt { margin-top: 18px; display: flex; flex-direction: column; gap: 13px; align-items: flex-start; }

  /* ── Шторка выбора устройства ──────────────────── */
  .sheet-bg {
    position: fixed; inset: 0; z-index: 70;
    background: rgba(6,8,6,.72); backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none; transition: opacity .22s var(--ease);
  }
  .sheet-bg[data-open] { opacity: 1; pointer-events: auto; }
  .sheet {
    position: absolute; left: 50%; bottom: 0; transform: translate(-50%, 100%);
    width: 100%; max-width: var(--shell);
    background: var(--ink-2); border-top: 1px solid var(--line-hi);
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom, 0));
    transition: transform .28s var(--ease);
  }
  .sheet-bg[data-open] .sheet { transform: translate(-50%, 0); }
  .sheet h3 {
    margin: 0 0 16px; font-family: var(--mono); font-size: var(--t-1);
    letter-spacing: .16em; text-transform: uppercase; color: var(--mute); font-weight: 500;
  }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grid button {
    appearance: none; cursor: pointer;
    background: var(--ink); border: 1px solid var(--line);
    color: var(--cream); padding: 14px 8px;
    font-family: var(--mono); font-size: var(--t-2);
    transition: border-color .18s var(--ease), color .18s var(--ease);
  }
  .grid button:hover { border-color: var(--green-dim); }
  .grid button[aria-pressed="true"] { border-color: var(--green); color: var(--green); }
  .grid button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

  /* ── Тост ──────────────────────────────────────── */
  .toast {
    position: fixed; left: 50%; bottom: 68px; z-index: 90;
    transform: translate(-50%, 18px);
    background: var(--green); color: #04140A;
    font-family: var(--mono); font-size: var(--t-2); font-weight: 700;
    padding: 10px 16px;
    opacity: 0; pointer-events: none;
    transition: opacity .2s var(--ease), transform .2s var(--ease);
  }
  .toast[data-show] { opacity: 1; transform: translate(-50%, 0); }

  /* ── Главное действие ──────────────────────────
     В Telegram уезжает в нативную MainButton — она приклеена к низу
     окна и не уходит при скролле. Вне Telegram (браузер, эта страница)
     рисуем такую же панель сами, чтобы композиция читалась одинаково. */
  .mainbar {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: 0; z-index: 50; width: 100%; max-width: var(--shell);
    padding: 14px 20px calc(14px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(rgba(10,10,10,0), var(--ink) 42%);
  }
  .mainbar[hidden] { display: none; }
  .mainbar .btn:disabled { cursor: default; opacity: .75; }

  .dots i {
    display: inline-block; width: 4px; height: 4px; margin-left: 3px;
    background: currentColor; border-radius: 50%;
    animation: blip 1.1s var(--ease) infinite;
  }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes blip { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

  @media (max-width: 359px) { :root { --d-3: 44px; --d-1: 26px; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<div class="glow"></div>
<div class="grain"></div>

<div class="shell" id="app" data-state="active">

  <header class="top">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">

    <div id="wiz" aria-live="polite"></div>

</div>

<!-- Шторка выбора: устройство или приложение -->

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h3 id="sheetTitle">Устройство</h3>
    <div class="grid" id="sheetGrid"></div>
    <div class="plans" id="sheetPlans" hidden></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Главное действие. В Telegram скрывается: его роль играет MainButton. -->
<div class="mainbar" id="mainbar"></div>

<!-- Панель прототипа — в продакшене удаляется целиком -->

<!-- Панель прототипа. На телефоне — свёрнутая плашка снизу,
     на большом экране — колонка рядом с корпусом. -->

<script>
/* Первым и отдельно от главного скрипта: ловит его ошибки, включая
   синтаксические — иначе страница молча показывала бы заготовку.
   На телефоне консоли нет, поэтому ошибка выводится прямо на экран. */
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  window.showError = (msg) => { try {
    document.getElementById('headTop').textContent = 'Ошибка';
    document.getElementById('headBottom').textContent = 'страницы';
    document.getElementById('statusNote').textContent = String(msg).slice(0, 140);
  } catch (e) {} };

  /* Телеметрия прототипа: мини-аппа пишет на сервер, до какого шага дошла.
     В боевой сборке — пустышка. */
  window.beacon = function (stage, extra) {
    try {
      const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
      const body = JSON.stringify(Object.assign({
        stage: stage, q: location.search, uid: u && u.id,
        tgv: tg && tg.version, plat: tg && tg.platform,
      }, extra || {}));
      if (navigator.sendBeacon) navigator.sendBeacon('log.php', body);
      else fetch('log.php', { method: 'POST', body: body, keepalive: true });
    } catch (e) {}
  };

  window.addEventListener('error', (e) => {
    const msg = String(e.message || e).slice(0, 200);
    showError(msg); beacon('error', { msg: msg, line: e.lineno || null });
  });
  window.addEventListener('unhandledrejection', (e) => {
    const msg = String(e.reason && e.reason.message || e.reason).slice(0, 200);
    showError(msg); beacon('rejection', { msg: msg });
  });
  beacon('script');
})();
</script>
<script>
(() => {
  'use strict';

  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready(); tg.expand();
    try { tg.setHeaderColor('#0A0A0A'); tg.setBackgroundColor('#0A0A0A'); } catch (e) {}
  }
  const has = (ver) => !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast(ver));
  const buzz = (k) => { try { tg.HapticFeedback.impactOccurred(k || 'light'); } catch (e) {} };
  const cheer = () => { try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {} };
  const $ = (id) => document.getElementById(id);
  const app = $('app');
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const Q = new URLSearchParams(location.search);

  /* Кто открыл: имя из Telegram — чтобы экран говорил с человеком, а не с «пользователем» */
  const TG_USER = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
  const NAME = TG_USER ? (TG_USER.first_name || TG_USER.username || '') : '';

  /* Открыты из клавиатуры бота (?src=kb) — можем ответить боту через sendData.
     Из инлайн-кнопок sendData недоступен: тогда сообщаем при следующем удобном случае. */
  const CAN_TELL = Q.get('src') === 'kb' && !!(tg && tg.sendData);
  let trialHere = false;
  let paidHere = null;
  function tellBot(payload) {
    beacon('tellBot', payload);
    if (!(tg && tg.sendData)) return false;
    try {
      tg.sendData(JSON.stringify(Object.assign(
        { device: state.device, phase: state.phase, trial: trialHere, paid: paidHere }, payload)));
      return true;
    } catch (e) { return false; }
  }

  /* Наружу. https — через Telegram; схемы приложений (happ://, incy://) —
     прямым переходом: вебвью передаёт их системе. Если приложение не
     стоит, ничего не произойдёт — на этот случай рядом всегда ручной путь. */
  function openExternal(url) {
    if (/^https?:/i.test(url)) {
      if (tg && tg.openLink) tg.openLink(url); else window.open(url, '_blank', 'noopener');
    } else if (!Q.has('sim')) {      // sim=… — проверка в браузере без запуска приложений
      location.href = url;
    }
  }

  /* ── Бэкенд ─────────────────────────────────────
     Прототип без сервера. Состояние подписки приходит из адреса — бот
     подставляет kind=new|trial|paid и until=YYYY-MM-DD, — и запоминается
     здесь (CloudStorage/localStorage), чтобы кнопка с клавиатуры, у которой
     адрес статичный, тоже знала, что подписка есть.
     В бою этот блок заменяет один запрос к бэку по initData. */
  const TRIAL_DAYS = 3;
  const TARIFFS = [
    { id: 'm1', title: '1 месяц',  price: '199 ₽',  days: 30,  devices: 3 },
    { id: 'm3', title: '3 месяца', price: '449 ₽',  days: 90,  devices: 3 },
    { id: 'y1', title: 'Год',      price: '1490 ₽', days: 365, devices: 5 },
  ];
  const TRIAL_DEVICES = 1;       // бесплатные дни — на одно устройство
  const CHECK_URL = 'https://www.instagram.com/';   // TODO: сайт, который без VPN не открывается
  const SUB_LINK = 'https://sub.hanvpn.app/user_' + (TG_USER ? TG_USER.id : '000000000');

  const sub = { kind: 'new', until: null, fetchedAt: null };

  let urlApplied = false;
  function loadSub() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem('han.sub') || 'null'); } catch (e) {}
    if (saved) { sub.kind = saved.kind; sub.until = saved.until ? new Date(saved.until) : null; sub.fetchedAt = saved.fetchedAt || null; }
    // Подсказка из адреса применяется один раз, при открытии: бот знает
    // точнее памяти. Но после действий здесь (включили дни, оплатили)
    // адрес уже устарел — второй раз его не читаем.
    if (urlApplied) return;
    urlApplied = true;
    const kind = Q.get('kind'), until = Q.get('until');
    // Бот — источник правды. Сказал «подписки нет» — память здесь устарела
    // (базу сбросили, другой аккаунт), стираем и начинаем с чистого листа.
    if (kind === 'new') {
      sub.kind = 'new'; sub.until = null; sub.fetchedAt = null; saveSub();
      state.appId = null; state.phase = 'connect';
      try { localStorage.removeItem(KEY); } catch (e) {}
      try { const cs = cloud(); if (cs && cs.removeItem) cs.removeItem(KEY, () => {}); } catch (e) {}
    }
    if (kind === 'trial' || kind === 'paid') { sub.kind = kind; if (until) sub.until = new Date(until + 'T21:00:00Z'); }
  }
  function saveSub() {
    try { localStorage.setItem('han.sub', JSON.stringify({ kind: sub.kind, until: sub.until, fetchedAt: sub.fetchedAt })); } catch (e) {}
  }

  const API = {
    async status() {
      await sleep(120);
      return {
        kind: sub.kind, expires_at: sub.until ? sub.until.toISOString() : null,
        subscription_url: SUB_LINK,
        config_fetched_at: sub.fetchedAt && Date.now() >= sub.fetchedAt ? new Date(sub.fetchedAt).toISOString() : null,
        last_client: sub.fetchedAt && Date.now() >= sub.fetchedAt ? currentApp() : null,
      };
    },
    async trial() {
      await sleep(200);
      sub.kind = 'trial'; sub.until = new Date(Date.now() + TRIAL_DAYS * 86400000); saveSub();
    },
    async pay(plan) {
      await sleep(300);
      const base = sub.until && sub.until > new Date() ? sub.until : new Date();
      sub.kind = 'paid'; sub.until = new Date(base.getTime() + plan.days * 86400000); saveSub();
    },
  };

  /* ── Статус ─────────────────────────────────────
     Из ответа бэка — то, что рисуется в шапке. Даты словами, без UTC-часов. */
  const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  const fmtDate = (d) => d.getDate() + ' ' + MONTHS[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '');
  function plural(n, one, few, many) { const a = Math.abs(n) % 100, b = a % 10; if (a > 10 && a < 20) return many; if (b > 1 && b < 5) return few; return b === 1 ? one : many; }
  const who = () => NAME ? NAME + ', ' : '';

  function describe(p) {
    const RENEW = { label: 'Продлить подписку', run: openPlans };
    if (!p.expires_at) {   // сюда попадаем только если включить дни не удалось
      return { name: 'none', beacon: 'нет подписки', cmd: 'han --trial',
               top: TRIAL_DAYS + ' дня', bottom: 'бесплатно',
               note: who() + 'подписки пока нет — включите бесплатные дни, карта не нужна',
               pct: 0, val: '—',
               renew: { label: 'Включить ' + TRIAL_DAYS + ' дня бесплатно', run: () => boot() },
               alt: { label: 'или купить сразу', run: openPlans } };
    }
    const until = new Date(p.expires_at), left = until - Date.now();
    const trial = p.kind === 'trial';
    const what = trial ? 'бесплатные дни' : 'подписка';
    if (left <= 0) {
      return { name: 'off', beacon: 'истекла', cmd: 'han --status',
               top: 'VPN', bottom: 'отключен',
               note: who() + (trial ? 'бесплатные дни закончились' : 'подписка закончилась ' + fmtDate(until)) + '. Оплатите — всё заработает, настраивать заново не нужно',
               pct: 6, val: 'offline', renew: { label: trial ? 'Купить подписку' : 'Продлить подписку', alarm: true, run: openPlans } };
    }
    const hours = left / 3600000;
    const pct = Math.max(4, Math.min(100, Math.round(left / ((trial ? TRIAL_DAYS : 30) * 86400000) * 100)));
    if (hours < 24) {
      const h = Math.max(1, Math.round(hours));
      return { name: 'soon', beacon: 'заканчивается', cmd: 'han --expires',
               top: 'Осталось', bottom: h + ' ' + plural(h, 'час', 'часа', 'часов'),
               note: who() + what + ' заканчива' + (trial ? 'ются' : 'ется') + ' — продлите, и ничего не прервётся',
               pct, val: h + ' ч', renew: { label: trial ? 'Купить подписку' : 'Продлить подписку', run: openPlans } };
    }
    const d = Math.round(hours / 24);
    const dl = Math.max(1, Math.ceil(hours / 24));        // бесплатных дней осталось — вверх, чтобы в первый день было «3»
    return { name: 'active', beacon: trial ? 'бесплатные дни' : 'активна', cmd: 'han --status',
             top: trial ? 'Бесплатно ещё' : 'Подписка',
             bottom: trial ? dl + ' ' + plural(dl, 'день', 'дня', 'дней') : 'активна',
             note: who() + (trial ? 'бесплатные дни до ' + fmtDate(until) + ' · ' + TRIAL_DEVICES + ' устройство'
                                 : 'подписка оплачена до ' + fmtDate(until)),
             pct, val: d + ' ' + plural(d, 'день', 'дня', 'дней'), renew: null };
  }

  let status = null;
  let lastClient = null;

  function paintState(view) {
    status = view;
    app.dataset.state = view.name;
    $('beaconText').textContent = view.beacon;
    $('statusCmd').textContent = view.cmd;
    $('headTop').textContent = view.top;
    $('headBottom').textContent = view.bottom;
    $('statusNote').textContent = view.note;
    $('railFill').style.setProperty('--pct', view.pct + '%');
    $('railVal').textContent = view.val;
    app.removeAttribute('data-connect-open');
    paint();
  }

  /* Бесплатные дни включаются сами: человек нажал «Подключить» — намерение
     ясно, спрашивать ещё раз незачем. Окно не закрываем (sendData закрыл бы),
     бот узнает из поля trial при возврате; в бою — бэк узнает сразу. */
  async function ensureTrial(st) {
    if (st.expires_at) return st;
    await API.trial();
    trialHere = true;
    toast(TRIAL_DAYS + ' дня бесплатно включены');
    return API.status();
  }

  /* Продление: шторка с тарифами. В бою вместо API.pay — tg.openInvoice. */
  function openPlans() {
    const box = $('sheetPlans');
    box.replaceChildren();
    TARIFFS.forEach((t) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = '<span>' + t.title + ' <small>до ' + t.devices + ' устр.</small></span><span><b>' + t.price + '</b> <small>демо</small></span>';
      b.addEventListener('click', async () => {
        closeSheet(); buzz('medium');
        await API.pay(t);
        paidHere = t.id; cheer();
        if (CAN_TELL && tellBot({ event: 'paid', plan: t.id })) return;
        toast('Оплачено (демо). До ' + fmtDate(sub.until));
        boot();
      });
      box.appendChild(b);
    });
    $('sheetTitle').textContent = 'Срок подписки';
    $('sheetGrid').hidden = true; box.hidden = false;
    $('sheetBg').setAttribute('data-open', '');
  }

  /* ── Приложение и устройство ─────────────────────
     Happ в России уже не скачать, но у многих он стоит. INCY — скачивается.
     Поэтому первый вопрос мастера — не «установите», а «что у вас есть». */
  /* Диплинки: INCY и Happ — из официальных доков; Shadowrocket — из конфига
     Remnawave; v2RayTun, Hiddify, Streisand — по шаблону Remnawave «://import/»,
     проверить на устройствах. Для чего угодно другого — ручной путь. */
  const APPS = {
    INCY:         { title: 'INCY',         add: (u) => 'incy://import/' + u,      open: 'incy://',        on: ['ios','android','macos','windows','linux','tv'] },
    Happ:         { title: 'Happ',         add: (u) => 'happ://add/' + u,         open: 'happ://',        on: ['ios','android','macos','windows','linux','tv'] },
    v2RayTun:     { title: 'v2RayTun',     add: (u) => 'v2raytun://import/' + u,  open: 'v2raytun://',    on: ['ios','android','macos','windows'] },
    Hiddify:      { title: 'Hiddify',      add: (u) => 'hiddify://import/' + u,   open: 'hiddify://',     on: ['ios','android','macos','windows','linux'] },
    Streisand:    { title: 'Streisand',    add: (u) => 'streisand://import/' + u, open: 'streisand://',   on: ['ios','macos'] },
    Shadowrocket: { title: 'Shadowrocket', add: (u) => 'shadowrocket://add/' + u, open: 'shadowrocket://',on: ['ios','macos'] },
    other:        { title: 'моё приложение', add: null, open: null,               on: ['ios','android','macos','windows','linux','tv'] },
  };
  const MAIN_APPS = ['INCY', 'Happ'];
  const DOWNLOAD_URL = (device) => 'https://hanvpn.app/download/incy/' + device;   // TODO: ваш редирект в магазин

  const DEVICES = {
    ios:     { short: 'iPhone',  what: 'из App Store',             finish: 'Нажмите «Загрузить» и дождитесь, пока приложение установится.' },
    android: { short: 'Android', what: 'для Android',              finish: 'Откройте скачанный файл и разрешите установку, если телефон спросит.' },
    macos:   { short: 'macOS',   what: 'для Mac',                  finish: 'Откройте скачанный файл и перетащите приложение в «Программы».' },
    windows: { short: 'Windows', what: 'для Windows',              finish: 'Откройте скачанный файл и пройдите установку до конца.' },
    linux:   { short: 'Linux',   what: 'для Linux',                finish: 'Разрешите файлу запускаться и откройте его.' },
    tv:      { short: 'TV',      what: 'для Android TV',           finish: 'Откройте скачанный файл через файловый менеджер и разрешите установку.' },
  };

  const state = { device: detectDevice(), appId: null, phase: 'connect', installing: false, retryReason: '' };
  function detectDevice() {
    const ua = navigator.userAgent;
    if (/android/i.test(ua)) return /TV|BRAVIA|AFT/i.test(ua) ? 'tv' : 'android';
    if (/iPhone|iPad|iPod/i.test(ua)) return 'ios';
    if (/Mac/i.test(ua)) return 'macos';
    if (/Win/i.test(ua)) return 'windows';
    if (/Linux/i.test(ua)) return 'linux';
    return 'macos';
  }
  const dev = () => DEVICES[state.device];
  const currentApp = () => (APPS[state.appId] ? state.appId : 'INCY');
  const appInfo = () => APPS[currentApp()];
  const appTitle = () => appInfo().title;
  const appsFor = (device) => Object.keys(APPS).filter((k) => k !== 'other' && APPS[k].on.includes(device));

  /* «Другое приложение»: список клиентов под это устройство + универсальный путь */
  function pickApp() {
    const items = appsFor(state.device).filter((k) => !MAIN_APPS.includes(k)).map((k) => ({ id: k, label: APPS[k].title }));
    items.push({ id: 'other', label: 'Другое — скопировать ссылку' });
    openSheet('Какое приложение стоит?', items, state.appId, (id) => {
      state.appId = id; save();
      if (id === 'other') toManual(); else tryConnect();
    });
  }

  /* ── Сценарий ───────────────────────────────────
     Не спрашиваем то, что можно попробовать. Одна кнопка «Подключить»
     дёргает приложение; получилось — увидит бэк. Не открылось — только
     тогда предлагаем поставить INCY или выбрать своё.

       connect → checking → done
                     └→ retry → (установить INCY → connect) | другое → connect | manual */
  const RETRY_AFTER = 8000;     // столько ждём открытия приложения, потом предлагаем выбор

  function tryConnect() {
    beacon('tap-connect', { app: currentApp(), phase: state.phase });
    sub.fetchedAt = Q.get('sim') === 'fail' ? null : Date.now() + 4500; saveSub();   // sim=ok|fail — для проверки
    openExternal(appInfo().add(SUB_LINK));
    go('checking');
  }

  const PHASES = {
    connect: {
      step: 1,
      title: () => state.installing ? 'Установили INCY? Подключаем' : 'Подключите VPN',
      text: () => currentApp() === 'INCY'
        ? 'Нажмите — откроется <b>INCY</b>, подписка добавится сама. Если INCY ещё нет, покажем, где взять.'
        : 'Нажмите — откроется <b>' + appTitle() + '</b>, подписка добавится сама.',
      cta: () => 'Подключить',
      run: tryConnect,
      alts: () => [
        { label: currentApp() === 'INCY' ? 'у меня Happ или другое приложение' : 'у меня другое приложение', run: () => go('retry') },
        { label: 'у меня другое устройство', run: pickDevice },
      ],
    },
    checking: {
      step: 2, busy: true,
      title: () => 'Открываем ' + appTitle(),
      text: () => 'Подтвердите добавление в приложении — мы увидим это сами.',
      cta: () => 'Проверяем',
      run: () => {},
      alts: () => [{ label: 'ничего не открылось', run: () => go('retry') }],
    },
    retry: {
      step: 1, back: 'connect',
      title: () => state.retryReason || 'Не открылось приложение?',
      text: () => 'Значит, его нет или стоит другое. Выберите, что подходит:',
      choices: () => [
        { label: '⬇️ Установить INCY', install: true, run: () => { state.installing = true; state.appId = 'INCY'; save(); openExternal(DOWNLOAD_URL(state.device)); go('connect'); } },
        { label: 'У меня Happ', run: () => { state.appId = 'Happ'; save(); tryConnect(); } },
        { label: 'Другое приложение', run: pickApp },
      ],
      alts: () => [
        { label: 'попробовать ещё раз', run: tryConnect },
        CAN_TELL ? { label: 'не получается — позвать помощь', run: () => tellBot({ event: 'failed' }) } : null,
      ],
    },
    manual: {
      step: 2, back: 'connect',
      title: () => 'Вставьте ссылку в ' + (currentApp() === 'other' ? 'приложение' : appTitle()),
      text: () => 'Ссылка уже скопирована. В приложении найдите «Добавить подписку», «Импорт» или кнопку «+» и вставьте её.',
      cta: () => 'Скопировать ещё раз',
      ghost: true,
      run: () => { copy(SUB_LINK, 'Ссылка скопирована'); startWatch(); },
      alts: () => [
        { label: 'готово, подписка добавилась', run: () => go('done') },
        CAN_TELL ? { label: 'не получается — позвать помощь', run: () => tellBot({ event: 'failed' }) } : null,
      ],
    },
    done: {
      /* Мини-аппа доводит до «подписка в приложении». Сам VPN человек
         включает уже внутри INCY/Happ — отсюда его не дёргаем. */
      step: 2, complete: true, ok: true,
      title: () => 'Подключено',
      text: () => '<b>' + (lastClient || appTitle()) + '</b> получил подписку. ' +
                  'Включите VPN в самом приложении — кнопка «Подключить» там, на главном экране.' +
                  '<br><br><i>Проверить просто: нажмите «Проверить» — если сайт открылся, VPN работает. ' +
                  'Не открылся — нажмите «Помощь» в боте.</i>',
      cta: () => CAN_TELL ? 'Готово' : null,
      run: () => { if (CAN_TELL) tellBot({ event: 'connected' }); },
      secondary: () => '🌐 Проверить, что работает',
      run2: () => openExternal(CHECK_URL),
      alts: () => [
        // бесплатные дни — одно устройство; второе только по тарифу
        sub.kind === 'trial'
          ? { label: 'нужно ещё устройство — выбрать тариф', run: openPlans }
          : { label: 'подключить другое устройство', run: () => { sub.fetchedAt = null; saveSub(); state.installing = false; pickDevice(); } },
      ],
    },
  };

  const POLL_EVERY = 2500, GIVE_UP_AFTER = RETRY_AFTER;
  let watchTimer = null;
  function stopWatch() { clearTimeout(watchTimer); watchTimer = null; }
  function startWatch() {
    stopWatch();
    const until = Date.now() + GIVE_UP_AFTER;
    const tick = async () => {
      const st = await API.status();
      if (st.config_fetched_at) { lastClient = st.last_client; cheer(); go('done'); return; }
      if (Date.now() >= until) { state.retryReason = 'Пока не видим подписку'; go('retry'); return; }
      watchTimer = setTimeout(tick, POLL_EVERY);
    };
    watchTimer = setTimeout(tick, POLL_EVERY);
  }

  function go(phase) {
    beacon('go', { to: phase });
    if (phase !== 'checking' && phase !== 'manual') stopWatch();
    state.phase = phase; save(); paint();
    if (phase === 'checking') startWatch();
    buzz('light');
  }

  /* ── Отрисовка ──────────────────────────────────── */
  function paint() {
    $('showConnect').textContent = state.phase === 'done'
      ? 'устройство настроено — настроить другое' : 'настроить подключение на устройстве';
    renderWizard(); paintPrimary(); paintRenew();
  }
  function wizardHidden() {
    return (status && (status.name === 'off' || status.name === 'none')) && !app.hasAttribute('data-connect-open');
  }

  function renderWizard() {
    const p = PHASES[state.phase] || PHASES.connect;
    const segs = $('prog').querySelectorAll('.prog-bar i');
    segs[0].toggleAttribute('data-on', true);
    segs[1].toggleAttribute('data-on', p.step >= 2);
    $('progTxt').textContent = p.complete ? 'Подключено' : 'Шаг ' + p.step + ' из 2';

    const step = document.createElement('div'); step.className = 'wiz-step';
    const h = document.createElement('h3'); h.className = 'wiz-title' + (p.ok ? ' ok' : ''); h.textContent = p.title(); step.appendChild(h);
    const t = document.createElement('p'); t.className = 'wiz-text'; t.innerHTML = p.text(); step.appendChild(t);

    if (p.choices) {
      // экран выбора: крупные варианты прямо в теле, главной кнопки внизу нет
      const box = document.createElement('div'); box.className = 'choice';
      p.choices().forEach((c) => {
        const b = document.createElement('button'); b.type = 'button';
        b.className = 'btn ' + (c.install ? 'btn-solid' : 'btn-ghost');
        if (c.install) b.style.marginTop = '10px';     // отдельно от «уже стоит»
        b.textContent = c.label; b.addEventListener('click', () => { buzz('medium'); c.run(); });
        box.appendChild(b);
      });
      step.appendChild(box);
    }
    if (p.secondary && p.secondary()) {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'btn btn-ghost';
      b.textContent = p.secondary(); b.addEventListener('click', () => { buzz('medium'); (p.run2 || p.run)(); }); step.appendChild(b);
    }
    const alts = (p.alts ? p.alts() : []).filter(Boolean);
    if (alts.length) {
      const wrap = document.createElement('div'); wrap.className = 'wiz-alt';
      alts.forEach((a) => { const l = document.createElement('button'); l.type = 'button'; l.className = 'linkish'; l.textContent = a.label; l.addEventListener('click', a.run); wrap.appendChild(l); });
      step.appendChild(wrap);
    }
    $('wiz').replaceChildren(step);
    if (tg && tg.BackButton) { if (p.back && !wizardHidden()) tg.BackButton.show(); else tg.BackButton.hide(); }
  }

  /* Ровно одно главное действие на экран */
  function currentPrimary() {
    const s = status;
    if (wizardHidden()) return { label: s.renew.label, alarm: s.name === 'off', run: s.renew.run };
    const p = PHASES[state.phase];
    if (p.choices) return null;                 // выбор — в теле экрана
    if (state.phase !== 'done') return { label: p.cta(), busy: !!p.busy, run: p.run, ghost: !!p.ghost };
    if (s.renew) return { label: s.renew.label, alarm: !!s.renew.alarm, run: s.renew.run };
    if (p.cta && p.cta()) return { label: p.cta(), run: p.run };
    return null;
  }

  let mainHandler = null;
  function paintPrimary() {
    const act = currentPrimary(); const bar = $('mainbar');
    if (tg && tg.MainButton && has('6.1')) {
      bar.hidden = true; const mb = tg.MainButton;
      if (mainHandler) { mb.offClick(mainHandler); mainHandler = null; }
      if (!act) { mb.hide(); return; }
      mb.setParams({ text: act.label, color: act.alarm ? '#FF2A2A' : '#22C55E', text_color: act.alarm ? '#FFFFFF' : '#04140A', is_active: !act.busy });
      if (act.busy) mb.showProgress(false); else mb.hideProgress();
      mainHandler = () => { buzz('medium'); act.run(); }; mb.onClick(mainHandler); mb.show(); return;
    }
    bar.hidden = !act; bar.replaceChildren(); if (!act) return;
    const b = document.createElement('button'); b.type = 'button';
    b.className = 'btn ' + (act.alarm ? 'btn-alarm' : act.ghost ? 'btn-ghost' : 'btn-solid');
    b.disabled = !!act.busy; b.textContent = act.label;
    if (act.busy) { const d = document.createElement('span'); d.className = 'dots'; d.innerHTML = '<i></i><i></i><i></i>'; b.appendChild(d); }
    b.addEventListener('click', () => { buzz('medium'); act.run(); }); bar.appendChild(b);
  }

  /* Продление в статусе — только когда главное действие занято мастером */
  function paintRenew() {
    const s = status; const slot = $('renewSlot'); slot.replaceChildren();
    if (!s) return;
    if (s.alt && wizardHidden()) {
      const l = document.createElement('button'); l.type = 'button'; l.className = 'linkish'; l.style.marginTop = '18px';
      l.textContent = s.alt.label; l.addEventListener('click', s.alt.run); slot.appendChild(l); return;
    }
    if (!s.renew || wizardHidden() || state.phase === 'done') return;
    const b = document.createElement('button'); b.type = 'button'; b.className = 'btn btn-ghost'; b.style.marginTop = '22px';
    b.textContent = s.renew.label; b.addEventListener('click', s.renew.run); slot.appendChild(b);
  }

  /* ── Шторка ─────────────────────────────────────── */
  const bg = $('sheetBg'), grid = $('sheetGrid');
  function openSheet(title, items, current, onPick) {
    $('sheetTitle').textContent = title; grid.replaceChildren(); grid.hidden = false; $('sheetPlans').hidden = true;
    items.forEach((it) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = it.label;
      b.setAttribute('aria-pressed', String(it.id === current)); b.addEventListener('click', () => { closeSheet(); onPick(it.id); }); grid.appendChild(b); });
    bg.setAttribute('data-open', '');
  }
  const closeSheet = () => bg.removeAttribute('data-open');
  function pickDevice() {
    openSheet('Ваше устройство', Object.entries(DEVICES).map(([id, d]) => ({ id, label: d.short })), state.device,
      (id) => { state.device = id; go('connect'); });
  }
  function toManual() { copy(SUB_LINK, 'Ссылка скопирована'); sub.fetchedAt = Date.now() + 7000; saveSub(); go('manual'); startWatch(); }
  bg.addEventListener('click', (e) => { if (e.target === bg) closeSheet(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
  $('showConnect').addEventListener('click', () => { app.setAttribute('data-connect-open', ''); paint(); buzz('light'); });

  /* ── Тост и копирование ─────────────────────────── */
  let toastTimer;
  function toast(text) { const t = $('toast'); t.textContent = text; t.setAttribute('data-show', ''); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.removeAttribute('data-show'), 1900); }
  async function copy(text, said) {
    try { await navigator.clipboard.writeText(text); }
    catch (e) { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (err) {} ta.remove(); }
    buzz('light'); toast(said);
  }

  /* ── Прогресс мастера: CloudStorage, откат на localStorage ── */
  const KEY = 'han.setup';
  const cloud = () => (has('6.9') && tg.CloudStorage) ? tg.CloudStorage : null;
  function save() {
    const raw = JSON.stringify({ device: state.device, appId: state.appId, phase: state.phase, installing: state.installing });
    const cs = cloud(); if (cs) cs.setItem(KEY, raw, () => {});
    try { localStorage.setItem(KEY, raw); } catch (e) {}
  }
  function load() {
    return new Promise((resolve) => {
      const fromLocal = () => { try { return localStorage.getItem(KEY); } catch (e) { return null; } };
      const cs = cloud(); if (!cs) return resolve(fromLocal());
      let done = false;
      const finish = (v) => { if (!done) { done = true; resolve(v); } };
      setTimeout(() => finish(fromLocal()), 1500);   // облако молчит — идём дальше
      try { cs.getItem(KEY, (err, val) => finish(err ? fromLocal() : (val || fromLocal()))); }
      catch (e) { finish(fromLocal()); }
    });
  }

  /* ── Старт ──────────────────────────────────────── */
  async function boot() {
    beacon('boot');
    const raw = await load();
    beacon('loaded', { raw: !!raw });
    if (raw) { try { Object.assign(state, JSON.parse(raw)); } catch (e) {} }
    const want = Q.get('platform');
    if (want && DEVICES[want]) { state.device = want; state.phase = 'connect'; }
    loadSub();
    let st = await API.status();
    beacon('status', { kind: st.kind, exp: st.expires_at, fetched: st.config_fetched_at });
    st = await ensureTrial(st);
    beacon('trial-checked', { kind: st.kind, exp: st.expires_at });
    if (st.config_fetched_at && !want) { lastClient = st.last_client; state.phase = 'done'; }
    else if (state.phase === 'checking') state.phase = 'connect';
    if (!PHASES[state.phase]) state.phase = 'connect';
    const view = describe(st);
    paintState(view);
    beacon('painted', { view: view.name, kind: sub.kind });
  }

  if (tg && tg.BackButton) tg.BackButton.onClick(() => { const p = PHASES[state.phase]; if (p && p.back) go(p.back); });
  boot().catch((e) => {
    // Тихий провал выглядит как «ничего не работает». Показываем, что случилось.
    try {
      $('headTop').textContent = 'Ошибка'; $('headBottom').textContent = 'загрузки';
      $('statusNote').textContent = String(e && e.message || e).slice(0, 120);
    } catch (err) {}
  });
})();
</script>
</body>
</html>
